<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Reference - AI Campus Placement Agent</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .redoc-nav {
      background: #ffffff;
      border-bottom: 1px solid #e9ecef;
      padding: 0.75rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <!-- Header Navigation -->
  <header class="redoc-nav d-flex flex-wrap align-items-center justify-content-between gap-2">
    <div class="d-flex align-items-center gap-2">
      <a class="navbar-brand fw-bold text-dark text-decoration-none fs-5" href="/">
        <i class="fa-solid fa-graduation-cap text-primary me-2"></i>AI Campus <span class="text-primary">Placement Agent</span>
      </a>
      <span class="badge bg-secondary-subtle text-secondary border rounded-pill px-3 py-1">
        Redoc API Reference
      </span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a href="/docs" class="btn btn-sm btn-outline-primary rounded-pill px-3">
        <i class="fa-solid fa-play me-1"></i> Interactive Swagger UI
      </a>
      <a href="/api/openapi.json" target="_blank" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
        <i class="fa-solid fa-code me-1"></i> OpenAPI Spec (JSON)
      </a>
      <a href="/" class="btn btn-sm btn-primary rounded-pill px-3">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to App
      </a>
    </div>
  </header>

  <!-- Redoc Mount Point -->
  <redoc spec-url="/api/openapi.json"></redoc>

  <!-- Redoc Bundle JS -->
  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
</body>
</html>
