{% extends "base.html" %}

{% block title %}Shared Report Unavailable - AI Campus Placement{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4">
                <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                <h4 class="fw-bold">Report Link Unavailable</h4>
                <p class="text-muted">{{ error_message or "This report link has expired or has been revoked by the owner." }}</p>
                <div class="mt-3">
                    <a href="/" class="btn btn-outline-primary">Return to Homepage</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
