
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Reset Password | AI Campus Placement Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🎓 AI Campus Placement Agent</a>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center py-5">
    <div class="card shadow-sm border-0 rounded-4 p-4" style="max-width: 450px; width: 100%;">

        <h2 class="text-center mb-2">Reset Password</h2>
        <p class="text-center text-muted mb-4">
            Create a new password for your account.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill">
                Reset Password
            </button>
        </form>

    </div>
</div>

</body>
</html>
