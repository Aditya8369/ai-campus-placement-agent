<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% block meta %}{% endblock %}
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Campus">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <title>{% block title %}AI Campus Placement Agent{% endblock %}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
  <!-- Custom CSS -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/print.css') }}" rel="stylesheet" media="print">
</head>
<body class="bg-light">
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand text-primary fw-bold" href="/">
        <i class="fa-solid fa-graduation-cap me-1"></i> AI Campus Placement
      </a>
      <div class="ms-auto d-flex gap-2">
        <a href="/" class="btn btn-sm btn-outline-secondary">Home</a>
        <a href="/aptitude" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-stopwatch me-1"></i>Aptitude</a>
        <a href="/group-discussion" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-users-rectangle me-1"></i>GD Practice</a>
        <a href="/companies" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-building me-1"></i>Companies</a>
        <a href="/history" class="btn btn-sm btn-outline-secondary">History</a>
        <a href="/admin/placement-cell" class="btn btn-sm btn-outline-info" title="Placement Cell Batch View"><i class="fa-solid fa-users-viewfinder me-1"></i>Placement Cell</a>
        <a href="/search" class="btn btn-sm btn-outline-primary"><i class="fas fa-search me-1"></i>Search</a>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="py-3 mb-5 mb-lg-0">
    {% block content %}{% endblock %}
  </main>

  <!-- Mobile Bottom Navigation Bar (#635) -->
  <nav class="d-lg-none fixed-bottom bg-white border-top shadow-lg py-2 px-1 z-3" aria-label="Mobile Navigation">
    <div class="d-flex justify-content-around text-center">
      <a href="/" class="text-decoration-none text-secondary d-flex flex-column align-items-center" style="font-size: 0.75rem;">
        <i class="fa-solid fa-house mb-1" style="font-size: 1.1rem;"></i>
        <span>Home</span>
      </a>
      <a href="/aptitude" class="text-decoration-none text-secondary d-flex flex-column align-items-center" style="font-size: 0.75rem;">
        <i class="fa-solid fa-code mb-1" style="font-size: 1.1rem;"></i>
        <span>Practice</span>
      </a>
      <a href="/applications" class="text-decoration-none text-secondary d-flex flex-column align-items-center" style="font-size: 0.75rem;">
        <i class="fa-solid fa-briefcase mb-1" style="font-size: 1.1rem;"></i>
        <span>Tracker</span>
      </a>
      <a href="/companies" class="text-decoration-none text-secondary d-flex flex-column align-items-center" style="font-size: 0.75rem;">
        <i class="fa-solid fa-building mb-1" style="font-size: 1.1rem;"></i>
        <span>Companies</span>
      </a>
      <a href="/profile" class="text-decoration-none text-secondary d-flex flex-column align-items-center" style="font-size: 0.75rem;">
        <i class="fa-solid fa-user mb-1" style="font-size: 1.1rem;"></i>
        <span>Profile</span>
      </a>
    </div>
  </nav>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .catch(function(err) {
            console.warn('ServiceWorker registration error:', err);
          });
      });
    }
  </script>
</body>
</html>
