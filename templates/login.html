<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Campus Placement Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            🎓 AI Campus Placement Agent
        </a>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center py-5">
    <div class="card shadow-sm border-0 rounded-4 p-4" style="max-width: 450px; width: 100%;">
        <h2 class="text-center mb-2">Welcome Back!</h2>
        <p class="text-center text-muted mb-4">Login to continue your placement preparation.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control"
                       placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill">
                Login
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>
    </div>
</div>

</body>
</html>
