<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Browser Chrome Window -->
  <rect x="20" y="20" width="960" height="600" rx="12" fill="#1e293b" filter="url(#cardShadow)"/>
  
  <!-- Window Header -->
  <rect x="20" y="20" width="960" height="42" rx="12" fill="#0f172a"/>
  <rect x="20" y="50" width="960" height="12" fill="#0f172a"/>
  
  <!-- Window Controls -->
  <circle cx="45" cy="41" r="6" fill="#ef4444"/>
  <circle cx="65" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="41" r="6" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="120" y="31" width="760" height="22" rx="6" fill="#1e293b"/>
  <text x="380" y="46" fill="#94a3b8" font-size="11">https://campus-placement-agent.ai/dashboard/demo-analysis</text>

  <!-- Dashboard Top Nav -->
  <rect x="20" y="62" width="960" height="50" fill="#1e293b" opacity="0.9"/>
  <text x="50" y="93" fill="#f8fafc" font-size="16" font-weight="700">AI Campus Placement Agent</text>
  <rect x="740" y="74" width="100" height="26" rx="13" fill="#334155"/>
  <text x="758" y="91" fill="#cbd5e1" font-size="11" font-weight="600">Export PDF</text>
  <rect x="850" y="74" width="105" height="26" rx="13" fill="url(#primaryGrad)"/>
  <text x="868" y="91" fill="#ffffff" font-size="11" font-weight="600">Mock Interview</text>

  <!-- Header Banner -->
  <rect x="45" y="130" width="910" height="90" rx="10" fill="#334155" opacity="0.6"/>
  <text x="70" y="165" fill="#f8fafc" font-size="20" font-weight="700">Placement Preparation Evaluation</text>
  <text x="70" y="195" fill="#94a3b8" font-size="13">Target Company: <tspan fill="#38bdf8" font-weight="600">Google</tspan> | Target Role: <tspan fill="#38bdf8" font-weight="600">Software Engineer (L3)</tspan> | Candidate: <tspan fill="#e2e8f0">Alex Chen</tspan></text>

  <!-- Left Column: ATS Score Gauge Card -->
  <rect x="45" y="240" width="280" height="350" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="70" y="275" fill="#e2e8f0" font-size="15" font-weight="700">Overall ATS Score</text>
  
  <!-- Score Circle -->
  <circle cx="185" cy="370" r="70" fill="none" stroke="#334155" stroke-width="14"/>
  <circle cx="185" cy="370" r="70" fill="none" stroke="url(#scoreGrad)" stroke-width="14" stroke-dasharray="440" stroke-dashoffset="65" stroke-linecap="round"/>
  <text x="160" y="375" fill="#ffffff" font-size="36" font-weight="800">88</text>
  <text x="195" y="375" fill="#94a3b8" font-size="16">/100</text>
  <text x="140" y="405" fill="#10b981" font-size="12" font-weight="600">HIGH MATCH</text>

  <!-- Mini Section Breakdown -->
  <text x="70" y="475" fill="#cbd5e1" font-size="12">Skills Relevance</text>
  <rect x="70" y="485" width="230" height="6" rx="3" fill="#334155"/>
  <rect x="70" y="485" width="210" height="6" rx="3" fill="#10b981"/>

  <text x="70" y="515" fill="#cbd5e1" font-size="12">Experience Impact</text>
  <rect x="70" y="525" width="230" height="6" rx="3" fill="#334155"/>
  <rect x="70" y="525" width="195" height="6" rx="3" fill="#3b82f6"/>

  <text x="70" y="555" fill="#cbd5e1" font-size="12">ATS Formatting Integrity</text>
  <rect x="70" y="565" width="230" height="6" rx="3" fill="#334155"/>
  <rect x="70" y="565" width="220" height="6" rx="3" fill="#8b5cf6"/>

  <!-- Right Column Top: Strengths & Keyword Matches -->
  <rect x="345" y="240" width="610" height="165" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="370" y="272" fill="#10b981" font-size="14" font-weight="700">✓ Verified Resume Strengths</text>
  <circle cx="380" cy="300" r="4" fill="#10b981"/>
  <text x="395" y="304" fill="#e2e8f0" font-size="12">Strong distributed systems exposure (Kafka event streaming with 10M+ daily events)</text>
  <circle cx="380" cy="330" r="4" fill="#10b981"/>
  <text x="395" y="334" fill="#e2e8f0" font-size="12">Quantified performance achievements (45% database latency reduction using indexed views)</text>
  <circle cx="380" cy="360" r="4" fill="#10b981"/>
  <text x="395" y="364" fill="#e2e8f0" font-size="12">Clear technical skill alignment: Python, Flask, Docker, Kubernetes, SQL, Git</text>

  <!-- Right Column Bottom: Recommended Changes -->
  <rect x="345" y="420" width="610" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="370" y="452" fill="#f59e0b" font-size="14" font-weight="700">⚡ Top Recommended Resume Adjustments</text>
  <circle cx="380" cy="480" r="4" fill="#f59e0b"/>
  <text x="395" y="484" fill="#e2e8f0" font-size="12">Highlight system design principles: add horizontal scaling metrics to experience section</text>
  <circle cx="380" cy="510" r="4" fill="#f59e0b"/>
  <text x="395" y="514" fill="#e2e8f0" font-size="12">Add Go or C++ concurrency exposure to match Google SDE infrastructure expectations</text>
  <circle cx="380" cy="540" r="4" fill="#f59e0b"/>
  <text x="395" y="544" fill="#e2e8f0" font-size="12">Convert passive bullet points into action-driven statements with concrete outcomes</text>
</svg>