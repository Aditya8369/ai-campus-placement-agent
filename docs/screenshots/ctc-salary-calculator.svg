<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Browser Chrome Window -->
  <rect x="20" y="20" width="960" height="600" rx="12" fill="#1e293b" filter="url(#shadow5)"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="960" height="42" rx="12" fill="#0f172a"/>
  <rect x="20" y="50" width="960" height="12" fill="#0f172a"/>
  <circle cx="45" cy="41" r="6" fill="#ef4444"/>
  <circle cx="65" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="41" r="6" fill="#10b981"/>
  <rect x="120" y="31" width="760" height="22" rx="6" fill="#1e293b"/>
  <text x="370" y="46" fill="#94a3b8" font-size="11">https://campus-placement-agent.ai/salary-calculator</text>

  <!-- Title Card -->
  <rect x="45" y="80" width="910" height="65" rx="10" fill="#334155" opacity="0.6"/>
  <text x="70" y="110" fill="#f8fafc" font-size="18" font-weight="700">CTC to In-Hand Monthly Salary &amp; Offer Comparison</text>
  <text x="70" y="132" fill="#94a3b8" font-size="12">Breaks down headline CTC offers into verified guaranteed monthly take-home pay under New Tax Regime slabs.</text>

  <!-- Left Column: Input Offer Form -->
  <rect x="45" y="160" width="380" height="430" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="195" fill="#38bdf8" font-size="14" font-weight="700">Offer Details (Offer A - Tech Recruiter)</text>

  <!-- Input Field 1: Total CTC -->
  <text x="70" y="230" fill="#cbd5e1" font-size="12">Annual Headline CTC (₹)</text>
  <rect x="70" y="240" width="330" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="263" fill="#f8fafc" font-size="13">18,00,000</text>

  <!-- Input Field 2: Base Fixed Pay -->
  <text x="70" y="295" fill="#cbd5e1" font-size="12">Guaranteed Fixed Base Pay (₹)</text>
  <rect x="70" y="305" width="330" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="328" fill="#f8fafc" font-size="13">14,00,000</text>

  <!-- Input Field 3: Performance Bonus -->
  <text x="70" y="360" fill="#cbd5e1" font-size="12">Variable Performance Bonus (₹)</text>
  <rect x="70" y="370" width="330" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="393" fill="#f8fafc" font-size="13">2,50,000</text>

  <!-- Input Field 4: Joining Bonus -->
  <text x="70" y="425" fill="#cbd5e1" font-size="12">First-Year Joining Bonus (₹)</text>
  <rect x="70" y="435" width="330" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="458" fill="#f8fafc" font-size="13">1,50,000</text>

  <!-- Calculate Button -->
  <rect x="70" y="500" width="330" height="42" rx="8" fill="#4f46e5"/>
  <text x="175" y="526" fill="#ffffff" font-size="13" font-weight="700">Calculate In-Hand Pay</text>

  <!-- Right Column: Take-Home Breakdown Card -->
  <rect x="445" y="160" width="510" height="430" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="470" y="195" fill="#10b981" font-size="15" font-weight="700">Monthly Take-Home Pay Breakdown</text>

  <!-- Big Number Banner -->
  <rect x="470" y="215" width="460" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="495" y="245" fill="#94a3b8" font-size="12">ESTIMATED MONTHLY IN-HAND (AFTER ALL DEDUCTIONS)</text>
  <text x="495" y="280" fill="#10b981" font-size="28" font-weight="800">₹ 98,450 / month</text>

  <!-- Deductions Itemized Breakdown -->
  <text x="470" y="325" fill="#cbd5e1" font-size="13" font-weight="600">Monthly Components &amp; Statutory Deductions:</text>
  
  <text x="470" y="355" fill="#94a3b8" font-size="12">Gross Monthly Fixed Base</text>
  <text x="870" y="355" fill="#f8fafc" font-size="12" font-weight="600">₹ 1,16,667</text>

  <text x="470" y="385" fill="#94a3b8" font-size="12">Employee Provident Fund (EPF @ 12% basic)</text>
  <text x="870" y="385" fill="#ef4444" font-size="12" font-weight="600">- ₹ 5,600</text>

  <text x="470" y="415" fill="#94a3b8" font-size="12">Professional Tax (PT)</text>
  <text x="870" y="415" fill="#ef4444" font-size="12" font-weight="600">- ₹ 200</text>

  <text x="470" y="445" fill="#94a3b8" font-size="12">Income Tax / TDS (New Tax Regime with 87A)</text>
  <text x="870" y="445" fill="#ef4444" font-size="12" font-weight="600">- ₹ 12,417</text>

  <!-- Comparison Highlight Note -->
  <rect x="470" y="480" width="460" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="490" y="508" fill="#38bdf8" font-size="12" font-weight="700">★ Key Placement Insights:</text>
  <text x="490" y="530" fill="#cbd5e1" font-size="11">• Guaranteed component represents 77.8% of headline CTC.</text>
  <text x="490" y="548" fill="#cbd5e1" font-size="11">• Variable bonuses are disbursed annually subject to individual &amp; company multipliers.</text>
</svg>